name: Generator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Build & smoke generate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache FHIR package
        uses: actions/cache@v5
        with:
          path: Generator/cache
          key: fhir-r5-core-5.0.0
          restore-keys: |
            fhir-r5-core-

      - name: Restore
        run: dotnet restore Generator/FhirFsGen/FhirFsGen.fsproj

      - name: Build generator
        run: dotnet build Generator/FhirFsGen/FhirFsGen.fsproj --configuration Release --no-restore

      - name: Smoke generate Patient
        run: >
          dotnet run --project Generator/FhirFsGen --configuration Release --no-build --
          --resource Patient --out Generator/out/r5

      - name: Assert generated artifacts
        run: |
          set -euo pipefail
          test -f Generator/out/r5/schemas/Patient.schema.json
          test -f Generator/out/r5/valuesets.json
          test -f Generator/out/r5/manifest.json
          test -f Generator/out/r5/GeneratedResourceCatalog.fs
          test -f Generator/out/r5/GeneratedSchemaValidator.fs
          echo "Generated $(ls Generator/out/r5/schemas/*.schema.json | wc -l | tr -d ' ') schema file(s)"

      - name: Build schema packages
        run: |
          dotnet restore Packages/FhirServer.Schemas/FhirServer.Schemas.fsproj
          dotnet build Packages/FhirServer.Schemas/FhirServer.Schemas.fsproj --configuration Release --no-restore
          dotnet restore Packages/FhirServer.Validation/FhirServer.Validation.fsproj
          dotnet build Packages/FhirServer.Validation/FhirServer.Validation.fsproj --configuration Release --no-restore
